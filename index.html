<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-hover { transition: all 0.2s; }
        .btn-hover:hover { transform: translateY(-2px); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        .progress-fill { transition: width 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 🎯 Бейджи сложности */
        .diff-emerald { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .diff-amber   { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        .diff-rose    { background: rgba(244, 63, 94, 0.15);  color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }
        .badge-enter  { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        /* Оптимизация изображений */
        #q-image {
            max-height: 250px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        /* Skeleton loader для изображений */
        .image-loading {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

<div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
</div>

<!-- ЭКРАН 1: ВВОД ИМЕНИ -->
<section id="screen-start" class="w-full max-w-md fade-in">
    <div class="glass rounded-2xl p-8 shadow-2xl text-center">
        <div class="text-4xl mb-2">🤖</div>
        <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">AI Quiz by Zahar</h1>
        <p class="text-gray-400 mb-6">Проверь, насколько хорошо ты разбираешься в искусственном интеллекте</p>
        <input id="name-input" type="text" placeholder="Введи своё имя" maxlength="20"
               class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-gray-700 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 text-white placeholder-gray-500 mb-4">
        <button id="start-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-semibold text-white btn-hover shadow-lg shadow-cyan-500/25">
            Начать квиз
        </button>
        <p id="start-error" class="text-red-400 text-sm mt-2 hidden"></p>
    </div>
</section>

<!-- ЭКРАН 2: КВИЗ -->
<section id="screen-quiz" class="w-full max-w-lg hidden fade-in">
    <div class="glass rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-4 text-sm text-gray-400">
            <span id="quiz-progress-text">Вопрос 1 из 6</span>
            <span id="quiz-score">Очки: 0</span>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-2 mb-6">
            <div id="progress-bar" class="progress-fill h-2 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500" style="width: 0%"></div>
        </div>

        <div id="question-container" class="text-center">
            <img id="q-image" src="" alt="question image" class="w-full h-48 object-cover rounded-xl mb-4 bg-gray-800/30 hidden">
            <h2 id="q-text" class="text-xl font-semibold mb-6 min-h-[3rem] flex items-center justify-center"></h2>
            <div id="q-options" class="space-y-3"></div>
        </div>
    </div>
</section>

<!-- ЭКРАН 3: РЕЗУЛЬТАТ + ТАБЛИЦА -->
<section id="screen-results" class="w-full max-w-2xl hidden fade-in">
    <div class="glass rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold mb-2">Результат</h2>
            <p class="text-gray-400" id="result-name"></p>
            <div class="text-6xl font-bold mt-4 bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent" id="result-score">0/12</div>
            <p class="text-gray-300 mt-2" id="result-message"></p>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="text-gray-400 text-sm border-b border-gray-700">
                    <th class="pb-2 pl-2">#</th>
                    <th class="pb-2">Имя</th>
                    <th class="pb-2 text-right pr-2">Результат</th>
                    <th class="pb-2 text-right pr-2">Дата</th>
                </tr>
                </thead>
                <tbody id="leaderboard-body" class="text-sm">
                <tr><td colspan="4" class="py-4 text-center text-gray-500">Загрузка результатов...</td></tr>
                </tbody>
            </table>
        </div>

        <button id="restart-btn" class="w-full mt-8 py-3 rounded-xl bg-gray-800 hover:bg-gray-700 font-medium text-white transition">
            Пройти ещё раз
        </button>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
